databases:
  - name: codematrix-db
    plan: free
    databaseName: codematrix
    user: codematrix

services:
  - type: web
    name: codematrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: RUNNER_MODE
        value: unavailable
      - key: DATABASE_URL
        fromDatabase:
          name: codematrix-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: "http://localhost:5173"

  - type: web
    name: codematrix-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /
    envVars:
      - key: API_PUBLIC_HOSTNAME
        fromService:
          type: web
          name: codematrix-api
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: API_SCHEME
        value: https
