databases:
  - name: codematrix-db
    plan: free
    databaseName: codematrix
    user: codematrix

services:
  - type: pserv
    name: codematrix-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: RUNNER_MODE
        value: unavailable
      - key: DATABASE_URL
        fromDatabase:
          name: codematrix-db
          property: connectionString
      - key: FRONTEND_ORIGINS
        value: "*"

  - type: web
    name: codematrix-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.web
    healthCheckPath: /
    envVars:
      - key: API_INTERNAL_URL
        fromService:
          type: pserv
          name: codematrix-api
          property: hostport
