services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codemind
      POSTGRES_USER: codemind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemind-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codemind -d codemind"]
      interval: 5s
      timeout: 3s
      retries: 15

  runner-image:
    image: codemind-python-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.runner
    profiles: ["build-only"]

  java-runner:
    image: codemind-java-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.runner-java
    profiles: ["build-only"]

  c-runner:
    image: codemind-c-runner:latest
    build:
      context: .
      dockerfile: Dockerfile.runner-c
    profiles: ["build-only"]

volumes:
  postgres_data:
